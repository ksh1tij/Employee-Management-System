version: '3.8'

services:
  api:
    build:
      context: ./backend/EmployeePortal.API
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  frontend:
    build:
      context: ./frontend/employee-portal-ui
      dockerfile: Dockerfile
    ports:
      - "3000:80"
