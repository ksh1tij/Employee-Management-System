  <section class="vh-100" style="background-color: #eee;">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-lg-12 col-xl-11">
          <div class="card text-black" style="border-radius: 25px;">
            <div class="card-body p-md-5">
              <div class="row justify-content-center">
                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
                  <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Sign up</p>
                  <form class="mx-1 mx-md-4" #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                      <div data-mdb-input-init class="form-outline flex-fill mb-0">
                        <input type="text" id="username" class="form-control" [(ngModel)]="user.username" name="username" required minlength="3" #username="ngModel" />
                        <label class="form-label" for="username">User Name</label>
                        <div *ngIf="username.invalid && (username.dirty || username.touched)" class="text-danger">
                          <div *ngIf="username.errors?.['required']">Username is required.</div>
                          <div *ngIf="username.errors?.['minlength']">Username must be at least 3 characters long.</div>
                        </div>
                      </div>
                    </div>
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                      <div data-mdb-input-init class="form-outline flex-fill mb-0">
                        <input type="email" id="email" class="form-control" [(ngModel)]="user.email" name="email" required email #email="ngModel" />
                        <label class="form-label" for="email">Email</label>
                        <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger">
                          <div *ngIf="email.errors?.['required']">Email is required.</div>
                          <div *ngIf="email.errors?.['email']">Invalid email address.</div>
                        </div>
                      </div>
                    </div>
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                      <div data-mdb-input-init class="form-outline flex-fill mb-0">
                        <input type="password" id="password" class="form-control" [(ngModel)]="user.password" name="password" required minlength="6" #password="ngModel" />
                        <label class="form-label" for="password">Password</label>
                        <div *ngIf="password.invalid && (password.dirty || password.touched)" class="text-danger">
                          <div *ngIf="password.errors?.['required']">Password is required.</div>
                          <div *ngIf="password.errors?.['minlength']">Password must be at least 6 characters long.</div>
                        </div>
                      </div>
                    </div>
                    <input class="form-check-input me-2" type="checkbox" value="" id="terms" required />
                    <div class="form-check d-flex justify-content-center mb-5">
                      <label class="form-check-label" for="terms">
                        I agree to all statements in <a href="#!">Terms of service</a>
                      </label>
                    </div>
                    <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                      <button type="submit" class="btn btn-primary btn-lg" [disabled]="registerForm.invalid">Register</button>
                    </div>
                  </form>
                </div>
                <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
                  <img src="../../../../../assets/work-time-employee-management-miniature-staff-tiny-people-run-clock-business-metaphor-concept-poster-social-banner-design-illustration-isolated-white-background_41477-199.avif"
                    class="img-fluid" alt="Sample image" style="width: 624.656px; height: 351.438px;">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
