<div *ngIf="isBrowser" style="display: flex; justify-content: space-around;">
  <div style="width: 45%; height: 400px;">
    <h3>Performance Metrics</h3>
    <canvas baseChart
            [datasets]="performanceMetricsData.datasets"
            [labels]="performanceMetricsData.labels"
            [options]="chartOptions"
            chartType="bar">
    </canvas>
  </div>
  <div style="width: 45%; height: 400px;">
    <h3>Competency</h3>
    <canvas baseChart
            [datasets]="competencyData.datasets"
            [labels]="competencyData.labels"
            [options]="chartOptions"
            chartType="bar">
    </canvas>
  </div>
</div>
